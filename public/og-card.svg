<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SapinSapin AI — Every voice belongs in the future">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .display { font-family: 'Fraunces', Georgia, serif; }
      .label { font-family: 'Inter', Arial, sans-serif; }
    </style>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="72%" y2="88%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="62%" stop-color="#000"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1A1613" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#FBF7F0"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Brand mark, scaled into a landscape graphic bleeding off the frame -->
  <rect x="840" y="-20" width="460" height="210" rx="105" fill="#EBD9AE"/>
  <rect x="720" y="210" width="580" height="210" rx="105" fill="#6E964A"/>
  <rect x="580" y="440" width="720" height="210" rx="105" fill="#5B3E96"/>

  <text x="90" y="168" class="label" font-weight="700" font-size="19" letter-spacing="3" fill="#1A1613" fill-opacity=".62">OPEN FOUNDATIONS FOR PHILIPPINE AI</text>

  <text x="90" y="260" class="display" font-weight="500" font-size="88" letter-spacing="-1.8" fill="#1A1613">SapinSapin AI</text>

  <text x="90" y="332" class="display" font-weight="500" font-size="54" letter-spacing="-1.1" fill="#1A1613">Every voice belongs</text>
  <text x="90" y="396" class="display" font-style="italic" font-weight="500" font-size="54" letter-spacing="-1.1" fill="#5B3E96">in the future.</text>

  <g transform="translate(90, 452)">
    <rect x="7" y="0" width="16" height="7" rx="3.5" fill="#EBD9AE"/>
    <rect x="3.5" y="9" width="23" height="7" rx="3.5" fill="#6E964A"/>
    <rect x="0" y="18" width="30" height="7" rx="3.5" fill="#5B3E96"/>
  </g>
  <text x="132" y="472" class="label" font-weight="600" font-size="22" letter-spacing="-.2" fill="#1A1613" fill-opacity=".72">sapinsapin.ai</text>
</svg>
