<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-label="SapinSapin AI — Every voice belongs in the future">
  <!-- X header 1500x500 — avatar covers the bottom-left -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .display { font-family: 'Fraunces', Georgia, serif; }
      .label { font-family: 'Inter', Arial, sans-serif; }
    </style>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="72%" y2="88%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="62%" stop-color="#000"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1500" height="500" fill="url(#gridFade)"/></mask>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1A1613" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="#FBF7F0"/>
  <rect width="1500" height="500" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect x="1187.5" y="-17.63" width="368.59" height="166.67" rx="83.33" fill="#EBD9AE"/>
  <rect x="1083.33" y="166.67" width="472.76" height="166.67" rx="83.33" fill="#6E964A"/>
  <rect x="955.13" y="350.96" width="600.96" height="166.67" rx="83.33" fill="#5B3E96"/>
  <text x="430" y="120" class="label" font-weight="700" font-size="15.2" letter-spacing="2.4" fill="#1A1613" fill-opacity=".62">OPEN FOUNDATIONS FOR PHILIPPINE AI</text>
  <text x="430" y="193.6" class="display" font-weight="500" font-size="70.4" letter-spacing="-1.44" fill="#1A1613">SapinSapin AI</text>
  <text x="430" y="251.2" class="display" font-weight="500" font-size="43.2" letter-spacing="-0.88" fill="#1A1613">Every voice belongs</text>
  <text x="430" y="302.4" class="display" font-weight="500" font-size="43.2" letter-spacing="-0.88" font-style="italic" fill="#5B3E96">in the future.</text>
  <g transform="translate(430 347.2) scale(0.8)">
    <rect x="7" y="0" width="16" height="7" rx="3.5" fill="#EBD9AE"/>
    <rect x="3.5" y="9" width="23" height="7" rx="3.5" fill="#6E964A"/>
    <rect x="0" y="18" width="30" height="7" rx="3.5" fill="#5B3E96"/>
  </g>
  <text x="463.6" y="363.2" class="label" font-weight="600" font-size="17.6" letter-spacing="-.2" fill="#1A1613" fill-opacity=".72">sapinsapin.ai</text>
</svg>
