name: Auto-merge bot PRs

# Run after CI finishes and whenever an external status (for example, Vercel)
# changes. This workflow never checks out or executes code from the PR branch.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
  status:

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: write
  issues: write

jobs:
  merge-dependabot-updates:
    if: github.repository == 'sapinsapin/sapinsapin-web'
    runs-on: ubuntu-24.04
    steps:
      - name: Merge passing Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          event_path="${GITHUB_EVENT_PATH:?GitHub did not provide the event payload path}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            prs=$(gh api "repos/$GH_REPO/pulls?state=open&base=main" --paginate \
              --jq '[.[] | select(.user.login == "dependabot[bot]" or (.user.login == "github-actions[bot]" and (.head.ref == "automation/hub-catalog" or (.head.ref | startswith("ssai-knowledge-refresh/"))))) | .number] | .[]')
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$(jq -r '.workflow_run.conclusion' "$event_path")" != "success" ]; then
              echo "CI did not pass; no pull request will be considered for merge."
              exit 0
            fi
            sha=$(jq -r '.workflow_run.head_sha' "$event_path")
            prs=$(gh api "repos/$GH_REPO/commits/$sha/pulls" \
              --jq '[.[] | select(.state == "open" and .base.ref == "main" and (.user.login == "dependabot[bot]" or (.user.login == "github-actions[bot]" and (.head.ref == "automation/hub-catalog" or (.head.ref | startswith("ssai-knowledge-refresh/")))))) | .number] | .[]')
          else
            sha=$(jq -r '.sha' "$event_path")
            prs=$(gh api "repos/$GH_REPO/commits/$sha/pulls" \
              --jq '[.[] | select(.state == "open" and .base.ref == "main" and (.user.login == "dependabot[bot]" or (.user.login == "github-actions[bot]" and (.head.ref == "automation/hub-catalog" or (.head.ref | startswith("ssai-knowledge-refresh/")))))) | .number] | .[]')
          fi

          if [ -z "$prs" ]; then
            echo "No open Dependabot pull request needs processing."
            exit 0
          fi

          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            candidate_sha=$(gh pr view "$pr" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')
            author=$(gh pr view "$pr" --repo "$GH_REPO" --json author --jq '.author.login')
            if [ "$author" = "app/github-actions" ] || [ "$author" = "github-actions[bot]" ]; then
              # Bot PRs are pushed with GITHUB_TOKEN, so GitHub never starts their
              # pull_request CI; the sync workflows dispatch CI by hand instead, and
              # GitHub does not count a dispatched run as the required `build` check
              # (PR stayed BLOCKED 2026-10-15 to 2026-11-05). Mirror a passing
              # dispatched CI run on this exact commit as a `build` commit status.
              ci_ok=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$candidate_sha&status=success" --jq '.total_count')
              has_status=$(gh api "repos/$GH_REPO/commits/$candidate_sha/statuses" --jq '[.[] | select(.context == "build" and .state == "success")] | length')
              if [ "${ci_ok:-0}" -gt 0 ] && [ "${has_status:-0}" -eq 0 ]; then
                gh api -X POST "repos/$GH_REPO/statuses/$candidate_sha" \
                  -f state=success -f context=build \
                  -f description="CI passed (dispatched run)" \
                  -f target_url="https://github.com/$GH_REPO/actions/workflows/ci.yml"
              fi
            fi

            checks=$(gh pr checks "$pr" --repo "$GH_REPO" --json bucket || true)
            if ! printf '%s' "$checks" | jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' >/dev/null; then
              echo "PR #$pr still has failing or pending checks; waiting for the next check update."
              continue
            fi

            body=$(gh pr view "$pr" --repo "$GH_REPO" --json body --jq '.body')
            if printf '%s' "$body" | grep -Fq 'version-update:semver-major'; then
              echo "PR #$pr contains a major dependency update; leaving it for human review."
              continue
            fi

            candidate_branch=$(gh pr view "$pr" --repo "$GH_REPO" --json headRefName --jq '.headRefName')
            candidate_sha=$(gh pr view "$pr" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')
            merge_state=$(gh pr view "$pr" --repo "$GH_REPO" --json mergeStateStatus --jq '.mergeStateStatus')
            if [ "$merge_state" = "DIRTY" ]; then
              echo "PR #$pr has merge conflicts; leaving it open for resolution."
              continue
            fi

            if gh pr merge "$pr" --repo "$GH_REPO" --squash --match-head-commit "$candidate_sha"; then
              # GITHUB_TOKEN merges do not trigger push workflows. Explicit dispatch does.
              if [[ "$candidate_branch" == ssai-knowledge-refresh/* ]]; then
                gh workflow run ssai-rag-deploy-production.yml --repo "$GH_REPO" --ref main
              fi
            else
              echo "GitHub did not merge PR #$pr yet ($merge_state); it will be reconsidered after the next check update."
            fi
          done <<EOF
          $prs
          EOF

      - name: Flag bot pull requests stuck for more than 2 days
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          stuck=$(gh api "repos/$GH_REPO/pulls?state=open&base=main" --paginate \
            --jq "[.[] | select((.user.login == \"dependabot[bot]\" or .user.login == \"github-actions[bot]\") and .created_at < \"$cutoff\") | .number] | .[]")
          for pr in $stuck; do
            title="Bot PR #$pr has been open for more than 2 days"
            existing=$(gh issue list --repo "$GH_REPO" --state open --search "\"$title\" in:title" --json number --jq 'length')
            if [ "$existing" -eq 0 ]; then
              gh issue create --repo "$GH_REPO" --title "$title" \
                --body "The auto-merge workflow has not been able to merge #$pr. Open its latest Auto-merge run for the reason, then merge or close it by hand."
            fi
          done
