name: Auto-merge bot PRs

# Run after CI finishes and whenever an external status (for example, Vercel)
# changes. This workflow never checks out or executes code from the PR branch.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
  status:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  merge-dependabot-updates:
    if: github.repository == 'sapinsapin/sapinsapin-web'
    runs-on: ubuntu-24.04
    steps:
      - name: Merge passing Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          event_path="${GITHUB_EVENT_PATH:?GitHub did not provide the event payload path}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            prs=$(gh api "repos/$GH_REPO/pulls?state=open&base=main" --paginate \
              --jq '[.[] | select(.user.login == "dependabot[bot]" or (.user.login == "github-actions[bot]" and (.head.ref == "automation/hub-catalog" or (.head.ref | startswith("ssai-knowledge-refresh/"))))) | .number] | .[]')
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$(jq -r '.workflow_run.conclusion' "$event_path")" != "success" ]; then
              echo "CI did not pass; no pull request will be considered for merge."
              exit 0
            fi
            sha=$(jq -r '.workflow_run.head_sha' "$event_path")
            prs=$(gh api "repos/$GH_REPO/commits/$sha/pulls" \
              --jq '[.[] | select(.state == "open" and .base.ref == "main" and (.user.login == "dependabot[bot]" or (.user.login == "github-actions[bot]" and (.head.ref == "automation/hub-catalog" or (.head.ref | startswith("ssai-knowledge-refresh/")))))) | .number] | .[]')
          else
            sha=$(jq -r '.sha' "$event_path")
            prs=$(gh api "repos/$GH_REPO/commits/$sha/pulls" \
              --jq '[.[] | select(.state == "open" and .base.ref == "main" and (.user.login == "dependabot[bot]" or (.user.login == "github-actions[bot]" and (.head.ref == "automation/hub-catalog" or (.head.ref | startswith("ssai-knowledge-refresh/")))))) | .number] | .[]')
          fi

          if [ -z "$prs" ]; then
            echo "No open Dependabot pull request needs processing."
            exit 0
          fi

          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            checks=$(gh pr checks "$pr" --repo "$GH_REPO" --json bucket)
            if ! printf '%s' "$checks" | jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' >/dev/null; then
              echo "PR #$pr still has failing or pending checks; waiting for the next check update."
              continue
            fi

            merge_state=$(gh pr view "$pr" --repo "$GH_REPO" --json mergeStateStatus --jq '.mergeStateStatus')
            if [ "$merge_state" = "DIRTY" ]; then
              echo "PR #$pr has merge conflicts; leaving it open for resolution."
              continue
            fi

            if ! gh pr merge "$pr" --repo "$GH_REPO" --squash; then
              echo "GitHub did not merge PR #$pr yet ($merge_state); it will be reconsidered after the next check update."
            fi
          done <<EOF
          $prs
          EOF
