name: SSAI RAG Health

# Read-only checks; sharing the deploy lock prevents probing during replacement.
on:
  schedule:
    - cron: '53 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ssai-rag-production-deploy
  cancel-in-progress: false

jobs:
  health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify source refresh ran successfully within 72 hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ssai-knowledge-refresh.yml/runs?branch=main&per_page=30" > /tmp/rag-refresh-runs.json
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const {workflow_runs:runs} = JSON.parse(readFileSync('/tmp/rag-refresh-runs.json'));
          const healthy = runs.some(r => ['schedule','workflow_dispatch'].includes(r.event) && r.conclusion === 'success' && Date.now()-Date.parse(r.created_at)<72*3600*1000);
          if (!healthy) throw new Error('No successful main source-refresh run in 72 hours.');
          JS
      - name: Detect stalled knowledge candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" > /tmp/rag-open-prs.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const stale = JSON.parse(readFileSync('/tmp/rag-open-prs.json')).filter(p => p.head.ref.startsWith('ssai-knowledge-refresh/') && Date.now()-Date.parse(p.created_at)>48*3600*1000);
          if (stale.length) throw new Error('Knowledge candidates pending over 48 hours: '+stale.map(p=>p.html_url).join(', '));
          JS
      - name: Verify production bytes, indexing and retrieval
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/rag/deploy-rag.mjs health
      - name: Verify live Sappy retrieves and answers
        run: |
          node --input-type=module - <<'JS'
          const base='https://sappy-ai.primary-bd7.workers.dev';
          const origin='https://sapinsapin.ai';
          const url=base+'/?q='+encodeURIComponent('Who is on the SapinSapin AI team?');
          // The Worker answers a transient workers-AI hiccup with 429/5xx plus
          // its own JSON error and correct CORS. The pipeline treats upstream
          // provider outages as possible, so one bad model call should not turn
          // the whole day red with no reason printed: retry those statuses (and
          // network/timeout failures) a bounded number of times, printing the
          // status, allow-origin and body of each failed attempt. A wrong
          // schema, a wrong CORS header or any other status fails immediately,
          // because a retry cannot fix those.
          const retryStatuses=new Set([429,500,502,503,504]);
          const attempts=3;
          // Overridable so the regression test can exercise the retry without
          // sleeping for real.
          const retryDelayMs=Number(process.env.SAPPY_HEALTH_RETRY_DELAY_MS??5000);
          let lastError;
          for(let attempt=1;attempt<=attempts;attempt++){
            let retriable=true;
            try{
              const response=await fetch(url,{headers:{Origin:origin},signal:AbortSignal.timeout(55000)});
              const allowOrigin=response.headers.get('access-control-allow-origin');
              const text=await response.text();
              if(response.status!==200 || allowOrigin!==origin){
                retriable=retryStatuses.has(response.status);
                throw new Error('Sappy public answer/CORS check failed (status '+response.status+', allow-origin '+allowOrigin+'). Body: '+text.slice(0,300));
              }
              const body=JSON.parse(text);
              if(typeof body.answer!=='string' || !/Tim Santos/i.test(body.answer) || !(body.retrieval?.chunks_found>0)){
                retriable=false;
                throw new Error('Sappy did not produce a retrieved team answer. Body: '+text.slice(0,300));
              }
              console.log('Live Sappy retrieved project knowledge and answered successfully (attempt '+attempt+'/'+attempts+').');
              lastError=undefined;
              break;
            }catch(error){
              lastError=error;
              console.error('Sappy attempt '+attempt+'/'+attempts+' failed: '+error.message);
              if(!retriable || attempt===attempts) break;
              await new Promise(resolve=>setTimeout(resolve,retryDelayMs*attempt));
            }
          }
          if(lastError) throw lastError;
          JS
      - name: Record health result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "RAG health result — $RESULT. See source-refresh and production retrieval steps for details." >> "$GITHUB_STEP_SUMMARY"
