name: SSAI RAG Production Deployment

# A merged RAG candidate is approved for deployment by the protected main
# branch: CI/Vercel must pass before merge. Production deployment then runs
# automatically and rolls back the existing item if indexing or retrieval QA
# fails. Manual dispatch is retained for a deliberate redeploy of main.
on:
  push:
    branches: [main]
    paths:
      - 'knowledge/generated/SapinSapin-knowledge-base-rag-current.md'
      - 'knowledge/qa/questions.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ssai-rag-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: Production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Validate the exact merged candidate
        run: node scripts/rag/validate-rag.mjs

      - name: Confirm Cloudflare credentials exist
        env:
          CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_TOKEN_SET" != true ] || [ "$CF_ACCOUNT_SET" != true ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as Production environment secrets."
            exit 1
          fi

      - name: Back up current production item
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/rag/deploy-rag.mjs backup

      - name: Retain pre-deploy backup
        uses: actions/upload-artifact@v6
        with:
          name: rag-production-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/rag-production-backup/
          retention-days: 90
          if-no-files-found: error

      - name: Replace item, wait for indexing, and run retrieval QA
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAG_BACKUP_DIR: ${{ runner.temp }}/rag-production-backup
        run: node scripts/rag/deploy-rag.mjs deploy
