# Keeps the published figures current without anyone remembering to.
#
# Why a scheduled commit rather than a Vercel cron: vercel.json's buildCommand is
# `npm run build`, so a plain rebuild re-bundles the SAME committed snapshot and
# refreshes nothing. And the Hub API pins access-control-allow-origin to
# huggingface.co, so the browser cannot fetch it either — build-time sync is the
# only route. Committing the refreshed snapshot also keeps git as the record of
# what any given deployment actually showed, which is the property the whole
# hubSnapshot.js design rests on.
#
# A passing catalog-sync PR auto-merges to main, which triggers the Vercel deploy.
#
# Lesson that shaped the "Report" step: from 23 Sep to 1 Oct 2026 the Space
# manifest sync failed on every single run — the Space had relabelled its model
# dropdown — and the only signal was a yellow job annotation nobody opened. The
# run stayed green, so the demo's model lists went stale for eight days. Any
# non-fatal failure now opens (or updates) one GitHub issue, so a silent
# degradation is a notification, not an archaeology project.

name: Sync Hub catalog

on:
  schedule:
    # Every six hours, off the hour on purpose (GitHub delays :00 schedules
    # under load). The first slot is 05:17 Manila. A run where the Hub has not
    # moved commits nothing and deploys nothing, so the extra runs cost a few
    # minutes of CI and buy a page that is at most six hours behind the org
    # rather than a day.
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # The Space deadlocks if two sessions talk to it at once, and two jobs racing
  # to push the same generated file is a merge conflict waiting to happen.
  group: hub-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Fatal: the Hub is the source of every number on the page.
      - name: Sync the Hub catalog
        run: npm run sync:catalog

      # Not fatal: the demo manifest is scaffolding that spaceClient.js refreshes
      # at runtime, and a sleeping Space must not throw away a good catalog
      # refresh. But it IS reported — see the last step.
      - name: Sync the Space manifest
        id: space
        continue-on-error: true
        run: npm run sync:space 2>&1 | tee space-sync.log; exit "${PIPESTATUS[0]}"

      # The contract test for the demo: endpoints, parameter order, CORS,
      # session-scoped choices. Read-only and sequential. Not fatal for the same
      # reason as above, and reported the same way.
      - name: Check the Space contract
        id: contract
        continue-on-error: true
        run: npm run check:space 2>&1 | tee space-check.log; exit "${PIPESTATUS[0]}"

      # Gates. Both run BEFORE the push, because the push deploys.
      - name: Check catalog parity
        run: npm run check:catalog
      - name: Build
        run: npm run build
      # After the build, because it hashes what the build emitted.
      - name: Check CSP hashes
        run: npm run check:csp

      # sync-catalog.mjs stamps syncedAt with today's date on every run, so the
      # file always differs even when the Hub has not moved. Committing on that
      # alone would deploy the site every single run to change one date string.
      # Drop a generated file if its date is the ONLY thing that changed.
      - name: Discard date-only changes
        run: |
          only_dates() {
            ! git diff --quiet -- "$1" && [ -z "$(git diff -U0 -- "$1" \
              | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' | grep -v 'syncedAt' || true)" ]
          }
          if only_dates src/data/hubSnapshot.js; then
            echo 'Hub unchanged — discarding the date-only snapshot change.'
            git checkout -- src/data/hubSnapshot.js public/sitemap.xml
          fi
          if only_dates src/data/spaceManifest.js; then
            echo 'Space unchanged — discarding the date-only manifest change.'
            git checkout -- src/data/spaceManifest.js
          fi

      - name: Commit and push refreshed snapshot branch
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/hubSnapshot.js src/data/spaceManifest.js public/sitemap.xml
          if git diff --cached --quiet; then
            echo 'Hub and Space unchanged — nothing to commit, nothing to deploy.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Sync Hub catalog'
          # The generated files are only ever written by this job, so a rebase
          # onto a newer main should be clean. Publish a bot-owned branch and
          # let CI + Vercel validate its PR before the merge workflow proceeds.
          git pull --rebase --quiet origin main
          branch='automation/hub-catalog'
          if git fetch origin "refs/heads/$branch" 2>/dev/null; then
            existing_commit=$(git rev-parse FETCH_HEAD)
            git push --force-with-lease="refs/heads/$branch:$existing_commit" origin "HEAD:$branch"
          else
            git push -u origin "HEAD:$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Open or update catalog sync PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh label create hub-catalog-sync --color 1d76db \
            --description 'Automated Hub catalog and demo manifest refresh' 2>/dev/null || true
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Sync Hub catalog: $(date -u +%Y-%m-%d)" \
              --label hub-catalog-sync \
              --body 'Automated catalog and demo-manifest refresh. The workflow ran catalog parity, build, CSP, and Space checks before proposing this update. CI and the Vercel preview must pass before it merges.'
          else
            echo "Updated existing catalog sync PR #$pr."
          fi
          # GITHUB_TOKEN pushes do not start normal push/pull_request workflows.
          # Dispatch CI explicitly for this bot-created PR branch.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Report a degraded sync
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPACE: ${{ steps.space.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          JOB: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Site sync is degraded'
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ "$SPACE" != failure ] && [ "$CONTRACT" != failure ] && [ "$JOB" = success ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Recovered in $RUN_URL — every sync step passed."
            fi
            exit 0
          fi
          {
            echo "The scheduled site sync finished with a problem: $RUN_URL"
            echo
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Hub catalog + build + deploy gates | $JOB |"
            echo "| Space manifest sync (demo lists) | $SPACE |"
            echo "| Space contract check | $CONTRACT |"
            for log in space-sync.log space-check.log; do
              [ -s "$log" ] || continue
              echo; echo "<details><summary>$log</summary>"; echo; echo '```'
              tail -n 30 "$log" | cut -c1-400
              echo '```'; echo "</details>"
            done
            echo
            echo "The live demo refreshes its lists from the Space at runtime, so a stale manifest degrades the first paint rather than breaking requests — but it does go stale until this is fixed. See CLAUDE.md, \"What updates on its own, and what does not\"."
          } > body.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md --label bug
          fi
