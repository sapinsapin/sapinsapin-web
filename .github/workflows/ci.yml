# Gates every push and pull request on the same checks the scheduled sync runs
# before it deploys.
#
# Vercel deploys main on push, so for a direct push this is an alarm rather
# than a gate — but it is the alarm that was missing: a hand edit that broke
# catalog parity or an inline-script hash would otherwise surface only when the
# next scheduled sync refused to deploy, hours later and for a reason that
# looks unrelated. On a pull request it is a real gate.
#
# No network to the Space and no Hub sync here: CI checks what was committed.
# Freshness is sync.yml's job.

name: CI

on:
  pull_request:
    # The bot workflows (Sync Hub catalog, SSAI Knowledge Refresh) commit only
    # generated files and then dispatch this workflow explicitly on their
    # branch. Their PRs are opened by github-actions[bot], and this repository
    # holds that actor's own pull_request runs at "action_required" until a
    # maintainer approves them. A held run still registers a github-actions
    # check suite with no jobs, and that empty suite becomes the newest one on
    # the head commit, shadowing the `build` check the dispatched run produced:
    # the required check then looks missing and the PR sits BLOCKED. That is
    # what kept the catalog-sync PR unmerged from 2026-10-11 to 2026-10-15.
    # Ignoring the generated paths stops GitHub creating that empty suite at
    # all. The bot workflows' pre-push gates plus their explicit dispatch remain
    # the gate for those PRs. A hand-written PR that touches *only* a generated
    # file should dispatch this workflow by hand (`gh workflow run ci.yml
    # --ref <branch>`), since generated files are never hand-edited (AGENTS.md).
    paths-ignore:
      - 'knowledge/**'
      - 'src/data/hubSnapshot.js'
      - 'src/data/spaceManifest.js'
      - 'public/sitemap.xml'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'knowledge/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate RAG candidate
        run: node scripts/rag/validate-rag.mjs
      - name: RAG reliability regression checks
        run: node --test scripts/rag/test/*.test.mjs
      - name: Check catalog parity
        run: npm run check:catalog
      - name: Build
        run: npm run build
      - name: Check CSP hashes
        run: npm run check:csp
