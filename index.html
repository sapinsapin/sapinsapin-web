<!doctype html>

    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the iPhone's notch and the
         Android gesture bar; every fixed or edge-anchored element then pads
         itself back out with env(safe-area-inset-*) in index.css. No
         maximum-scale and no user-scalable=no: pinch zoom stays available,
         which is why the form controls are sized to 16px on touch instead
         (see "Touch and small screens" in index.css) rather than by locking
         the viewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7F0" />
    <!-- Resolve the theme before first paint so the page never flashes the
         wrong palette, and colour the browser chrome to match straight away. -->
    <script>
      (function () {
        var theme = 'light'
        try { theme = localStorage.getItem('sapinsapin-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') } catch (e) { /* private mode */ }
        var root = document.documentElement
        root.dataset.theme = theme
        root.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0D0C0B' : '#FBF7F0'
      })()
    </script>

    <link rel="dns-prefetch" href="https://huggingface.co" />
    <!-- Fonts load without blocking first paint: the sheet is fetched at high
         priority via preload, then swapped in through the media trick once it
         arrives. `display=swap` means text is painted in the fallback
         immediately rather than waiting on a third-party round trip. Fraunces
         600 is not requested — nothing on the page uses it; the display face
         is only ever set at 400 and 500. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap" />

    <noscript>
      <div style="max-width:800px;margin:0 auto;padding:2rem;font-family:Georgia,serif;color:#1A1613;background:#FBF7F0">
        <h1 style="font-size:2.5rem;letter-spacing:-.04em">SapinSapin AI — Open Foundations for Philippine AI</h1>
        <p style="font-size:1.1rem;line-height:1.7;color:#444">SapinSapin AI builds open speech and language foundations so Philippine AI can be made with — and for — the people who speak it.</p>

        <h2 style="margin-top:2rem">What We Build</h2>
        <p>Open datasets, speech recognition models, text-to-speech systems, and language models for 10+ Philippine languages: Filipino, Cebuano, Ilocano, Hiligaynon, Bikol, Pangasinan, Kapampangan, Tausug, Waray, and English.</p>

        <h2 style="margin-top:2rem">Datasets</h2>
        <ul>
          <li><strong>Philippine Language Dataset (PLD)</strong> — 334,268 utterances across 10 languages, 448+ hours of prompted 16 kHz speech</li>
          <li><strong>Filipino Speech Corpus</strong> — 305,246 segments, 65+ hours of Filipino/Tagalog speech (MIT license)</li>
          <li><strong>BantayWika</strong> — 6.09M verified tokens of Filipino, Cebuano, and Ilocano text</li>
          <li><strong>halohalo</strong> — 45,536 rows of cleaned Philippine-language web data</li>
        </ul>

        <h2 style="margin-top:2rem">Models</h2>
        <p>28 public models spanning speech recognition (Whisper fine-tunes), text-to-speech (SpeechT5 fine-tunes), voice conversion, and text generation (Llama 3.1 and GPT-oss-20b continued pretraining).</p>

        <h2 style="margin-top:2rem">Live Demo</h2>
        <p>Try speech recognition, text-to-speech, and voice conversion for Philippine languages at <a href="https://huggingface.co/spaces/sapinsapin/halohalo-dashboard">the halohalo Space on Hugging Face</a>.</p>

          <dd>Licenses are dataset-specific. MIT and the UP-DSP research license appear among the current datasets. Always read the dataset card before use.</dd>

          <dd>It depends on the individual dataset license and any access conditions. The linked Hugging Face dataset card is the source of record.</dd>
